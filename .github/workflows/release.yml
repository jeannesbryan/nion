name: Build and release NiOn AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load manifest and validate tag
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/manifest.sh
          echo "NION_VERSION=$NION_VERSION" >> "$GITHUB_ENV"
          echo "NION_APPIMAGE_BASENAME=$NION_APPIMAGE_BASENAME" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "v$NION_VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME:-<none>} does not match release manifest v$NION_VERSION" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            libglib2.0-dev-bin \
            bubblewrap \
            xdg-dbus-proxy \
            desktop-file-utils \
            appstream \
            binutils \
            file \
            ca-certificates \
            curl \
            gnupg \
            gh

      - name: Prepare verified Tor runtime
        run: ./scripts/fetch-tor-runtime.sh

      - name: Build production AppImage
        run: ./scripts/build-appimage.sh

      - name: Release preflight
        run: ./scripts/release-preflight.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NiOn-${{ env.NION_VERSION }}-x86_64
          if-no-files-found: error
          path: |
            dist/${{ env.NION_APPIMAGE_BASENAME }}
            dist/${{ env.NION_APPIMAGE_BASENAME }}.sha256

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/manifest.sh
          assets=(
            "dist/$NION_APPIMAGE_BASENAME"
            "dist/$NION_APPIMAGE_BASENAME.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "NiOn $NION_VERSION — Maintenance" \
              --notes-file GITHUB_RELEASE.md
          fi
