name: Build and release NiOn AppImage

on:
  push:
    tags:
      - 'v1.1.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            libglib2.0-dev-bin \
            bubblewrap \
            xdg-dbus-proxy \
            desktop-file-utils \
            appstream \
            binutils \
            file \
            ca-certificates \
            curl \
            gnupg \
            gh

      - name: Prepare verified Tor runtime
        run: ./scripts/fetch-tor-runtime.sh

      - name: Build production AppImage
        run: ./scripts/build-appimage.sh

      - name: Release preflight
        run: ./scripts/release-preflight.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NiOn-${{ github.ref_name }}-x86_64
          if-no-files-found: error
          path: |
            dist/NiOn-1.1.0-x86_64.AppImage
            dist/NiOn-1.1.0-x86_64.AppImage.sha256

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            dist/NiOn-1.1.0-x86_64.AppImage
            dist/NiOn-1.1.0-x86_64.AppImage.sha256
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "NiOn 1.1.0 — Stable" \
              --notes-file GITHUB_RELEASE.md
          fi
