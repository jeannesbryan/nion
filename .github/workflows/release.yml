name: Build and release NiOn AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage-x86_64:
    # The pinned release environment. Keep this aligned with
    # release/manifest/GLIBC_FLOOR: a runner with a newer C library would produce
    # an AppImage that cannot start on the distributions NiOn supports.
    runs-on: ubuntu-24.04
    env:
      # The runner has docker, so the cross-distribution smoke test in
      # release-preflight.sh must not be skipped here.
      NION_REQUIRE_CONTAINER_TEST: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load manifest and validate tag
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/manifest.sh
          echo "NION_VERSION=$NION_VERSION" >> "$GITHUB_ENV"
          echo "NION_APPIMAGE_BASENAME=$NION_APPIMAGE_BASENAME" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "v$NION_VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME:-<none>} does not match release manifest v$NION_VERSION" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            libglib2.0-dev-bin \
            bubblewrap \
            xdg-dbus-proxy \
            desktop-file-utils \
            appstream \
            binutils \
            file \
            ca-certificates \
            curl \
            gnupg \
            gh

      - name: Verify pinned release environment
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/manifest.sh
          host_glibc="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "runner glibc=$host_glibc supported floor=$NION_GLIBC_FLOOR"
          if awk -v a="$host_glibc" -v b="$NION_GLIBC_FLOOR" 'BEGIN{
                n=split(a,x,"."); m=split(b,y,".");
                for (i=1;i<=3;i++) { xi=(i<=n?x[i]:0)+0; yi=(i<=m?y[i]:0)+0;
                  if (xi>yi) exit 1; if (xi<yi) exit 0; }
                exit 0 }'; then
            echo "PASS: release runner is at or below the supported C library floor."
          else
            echo "::error::This runner provides glibc $host_glibc, which is newer than the supported floor $NION_GLIBC_FLOOR." >&2
            echo "Bundled GTK/WebKitGTK libraries would then require a newer libc than NiOn promises." >&2
            echo "Build with ./scripts/build-release-container.sh instead." >&2
            exit 1
          fi

      - name: Prepare verified Tor runtime
        run: ./scripts/fetch-tor-runtime.sh

      # A plain native build is what preflight and the bridge validator
      # self-check want to exercise; the AppImage build below is separate.
      - name: Native release build
        run: |
          meson setup build --buildtype=release
          meson compile -C build

      - name: Build production AppImage
        run: ./scripts/build-appimage.sh

      - name: Release preflight
        run: ./scripts/release-preflight.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NiOn-${{ env.NION_VERSION }}-x86_64
          if-no-files-found: error
          path: |
            dist/${{ env.NION_APPIMAGE_BASENAME }}
            dist/${{ env.NION_APPIMAGE_BASENAME }}.sha256

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/manifest.sh
          assets=(
            "dist/$NION_APPIMAGE_BASENAME"
            "dist/$NION_APPIMAGE_BASENAME.sha256"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "NiOn $NION_VERSION" \
              --generate-notes
          fi
